<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Google Search Console</title>

    <!--
    INSTRUCCIONES PARA VERIFICAR EL SITIO EN GOOGLE SEARCH CONSOLE:

    1. Ve a https://search.google.com/search-console
    2. Haz clic en "Agregar propiedad"
    3. Selecciona "Prefijo de URL" e ingresa: https://jorch01.github.io/centro-educativo-esl/
    4. Selecciona el método de verificación "Etiqueta HTML"
    5. Copia la etiqueta meta que Google te proporciona (será algo como):
       <meta name="google-site-verification" content="TU_CODIGO_UNICO_AQUI" />
    6. Pega esa etiqueta en la sección <head> del index.html justo después de <meta charset="UTF-8">
    7. Sube los cambios a GitHub
    8. Regresa a Google Search Console y haz clic en "Verificar"

    ALTERNATIVA - Método de archivo HTML:
    Si prefieres usar un archivo HTML para verificar:
    1. Google te dará un nombre de archivo como: googleXXXXXXXXXXXXXXXX.html
    2. Renombra ESTE archivo a ese nombre exacto
    3. Google también te dará el contenido del archivo
    4. Reemplaza el contenido de este archivo con el que Google te proporcione
    5. Sube el archivo a GitHub
    6. El archivo debe ser accesible en: https://jorch01.github.io/centro-educativo-esl/googleXXXXXXXXXXXXXXXX.html
    7. Haz clic en "Verificar" en Google Search Console

    DESPUÉS DE LA VERIFICACIÓN:
    - Google indexará tu sitio automáticamente
    - Envía el sitemap manualmente desde Search Console: sitemap.xml
    - Espera 24-48 horas para ver tu sitio en los resultados de búsqueda
    - Monitorea el rendimiento en Search Console regularmente

    KEYWORDS PRINCIPALES A MONITOREAR:
    - inversión inmobiliaria cancún
    - centro educativo en venta cancún
    - oportunidad inversión quintana roo
    - propiedad comercial cancún
    - socios inversionistas inmobiliarios
    - aportación capital inmuebles
    - desarrollo inmobiliario cancún
    -->
</head>
<body>
    <h1>Archivo de verificación para Google Search Console</h1>
    <p>Este archivo es necesario para verificar la propiedad del sitio en Google Search Console.</p>
    <p>Por favor, sigue las instrucciones en el código fuente de este archivo.</p>
</body>
</html>
